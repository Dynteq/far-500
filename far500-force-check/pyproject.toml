[project]
name = "far500-force-check"
version = "0.1.0"
description = "FAR-500 bedienkracht-normtoetsing en XLSX/PDF-rapportgenerator"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
far500-force-check = "far500_force_check.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
