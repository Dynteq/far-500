<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FH500 Logger — kracht/hoek</title>
<style>
  :root{
    --bg:#0e1414; --panel:#16201f; --line:#26302f; --ink:#e7eeec; --dim:#8aa39f;
    --cyan:#00b4ce; --amber:#f0b429; --ok:#36c98a; --bad:#e5564b;
    --mono:"SFMono-Regular",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
    --sans:Inter,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  header{display:flex;align-items:center;gap:16px;padding:18px 24px;border-bottom:1px solid var(--line)}
  header .mark{width:10px;height:28px;background:var(--cyan);border-radius:2px}
  header h1{font-size:16px;font-weight:600;letter-spacing:.04em;margin:0}
  header .sub{font-family:var(--mono);font-size:12px;color:var(--dim);margin-left:auto;letter-spacing:.05em}
  .status{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--bad);transition:.2s}
  .dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
  main{display:grid;grid-template-columns:340px 1fr;gap:1px;background:var(--line);min-height:calc(100vh - 65px)}
  .col{background:var(--bg);padding:24px;display:flex;flex-direction:column;gap:20px}
  .readout{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 22px}
  .readout .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .readout .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:44px;font-weight:600;line-height:1.1;margin-top:6px}
  .readout .unit{font-size:18px;color:var(--dim);margin-left:6px}
  .readout.force .val{color:var(--cyan)} .readout.angle .val{color:var(--amber)}
  .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{flex:1;border:0;border-radius:0;background:var(--panel);color:var(--dim);padding:9px}
  .seg button.active{background:var(--amber);color:#1a1400;font-weight:600}
  .seg button:not(:last-child){border-right:1px solid var(--line)}
  .axis-row{display:flex;align-items:center;gap:12px}
  .axis-row .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink);background:var(--panel);
         border:1px solid var(--line);border-radius:8px;padding:11px 12px;cursor:pointer;transition:.12s}
  button:hover:not(:disabled){border-color:var(--dim)}
  button:disabled{opacity:.35;cursor:not-allowed}
  button.primary{background:var(--cyan);color:#04181c;border-color:var(--cyan);font-weight:600}
  button.danger{color:var(--bad);border-color:#3a2a2a}
  button.wide{grid-column:1 / -1}
  .meta{font-family:var(--mono);font-size:12px;color:var(--dim);line-height:1.8}
  .meta b{color:var(--ink);font-weight:500}
  .chart-wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px 10px}
  .chart-wrap h2{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
  canvas{width:100%;display:block}
  .hint{font-size:12px;color:var(--dim);line-height:1.6;border-top:1px solid var(--line);padding-top:14px}
  .hint code{font-family:var(--mono);color:var(--cyan)}
</style>
</head>
<body>
<header>
  <div class="mark"></div><h1>FH500 LOGGER</h1>
  <span class="status"><span class="dot" id="dot"></span><span id="connTxt">niet verbonden</span></span>
  <span class="sub">kracht / hoek · BLE</span>
</header>
<main>
  <section class="col">
    <div class="readout force"><div class="lbl">Kracht</div>
      <div class="val"><span id="forceVal">—</span><span class="unit">N</span></div></div>
    <div class="readout angle"><div class="lbl">Hoek (as <span id="axLbl">X</span>)</div>
      <div class="val"><span id="angleVal">—</span><span class="unit">°</span></div></div>

    <div class="axis-row"><span class="lbl">As</span>
      <div class="seg" id="axSeg">
        <button data-ax="X" class="active">X-as (pitch)</button>
        <button data-ax="Y">Y-as (roll)</button>
      </div></div>

    <div class="btns">
      <button id="btnConnect" class="primary wide">Verbinden</button>
      <button id="btnTare" disabled>Tare 0°</button>
      <button id="btnStop" disabled>Stop</button>
      <button id="btnStart" class="primary" disabled>Start meting</button>
      <button id="btnClear" class="danger" disabled>Wis device</button>
      <button id="btnCsv" class="wide" disabled>Download CSV (live)</button>
      <button id="btnDump" class="wide" disabled>Haal device-log op</button>
    </div>

    <div class="meta">
      samples&nbsp;&nbsp;<b id="nSamples">0</b><br>
      laatste&nbsp;t&nbsp;&nbsp;<b id="lastT">0</b>&nbsp;ms<br>
      accu&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<b id="bat">—</b>&nbsp;%<br>
      meting&nbsp;&nbsp;&nbsp;<b id="runState">gestopt</b>
    </div>

    <div class="hint">Chrome/Edge op desktop. Volgorde: <code>Verbinden</code> → as kiezen →
      sensor in nulstand → <code>Tare 0°</code> → <code>Start meting</code>.</div>
  </section>

  <section class="col">
    <div class="chart-wrap"><h2>Kracht &amp; hoek — verloop</h2><canvas id="tsCanvas" height="260"></canvas></div>
    <div class="chart-wrap"><h2>Kracht vs. hoek</h2><canvas id="xyCanvas" height="300"></canvas></div>
  </section>
</main>

<script>
const SERVICE="9a8b0001-1d4c-4f6e-9b2a-2f3e4d5c6b7a";
const DATA="9a8b0002-1d4c-4f6e-9b2a-2f3e4d5c6b7a";
const CTRL="9a8b0003-1d4c-4f6e-9b2a-2f3e4d5c6b7a";
const LOG="9a8b0004-1d4c-4f6e-9b2a-2f3e4d5c6b7a";
let ctrlChar=null, running=false, samples=[], dumpLines=[], dumping=false;
const dec=new TextDecoder(), $=id=>document.getElementById(id);
const dot=$("dot"), connTxt=$("connTxt");

$("btnConnect").onclick=async()=>{
  if(!navigator.bluetooth){alert("Web Bluetooth niet beschikbaar. Gebruik Chrome of Edge op desktop.");return;}
  try{
    const dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:"FAR-500"}],optionalServices:[SERVICE]});
    dev.addEventListener("gattserverdisconnected",onDisconnect);
    const srv=await dev.gatt.connect(), svc=await srv.getPrimaryService(SERVICE);
    ctrlChar=await svc.getCharacteristic(CTRL);
    const data=await svc.getCharacteristic(DATA); await data.startNotifications();
    data.addEventListener("characteristicvaluechanged",onData);
    const log=await svc.getCharacteristic(LOG); await log.startNotifications();
    log.addEventListener("characteristicvaluechanged",onLog);
    setConnected(true,dev.name||"FAR-500");
  }catch(e){ if(e.name!=="NotFoundError") alert("Verbinden mislukt: "+e.message); }
};
function setConnected(on,name){
  dot.classList.toggle("on",on); connTxt.textContent=on?name:"niet verbonden";
  ["btnTare","btnStart","btnClear","btnDump"].forEach(id=>$(id).disabled=!on);
  $("btnStop").disabled=true; $("btnConnect").textContent=on?"Verbonden":"Verbinden"; $("btnConnect").disabled=on;
}
function onDisconnect(){ setConnected(false); running=false; updateRun(); $("btnConnect").disabled=false; }

async function send(cmd){ if(ctrlChar) await ctrlChar.writeValue(new TextEncoder().encode(cmd)); }
$("btnTare").onclick =()=>send("TARE");
$("btnStart").onclick=()=>{ samples=[]; redraw(); send("START"); running=true; updateRun(); };
$("btnStop").onclick =()=>{ send("STOP"); running=false; updateRun(); };
$("btnClear").onclick=()=>{ if(confirm("Device-log wissen?")) send("CLEAR"); };
$("btnDump").onclick =()=>{ dumpLines=[]; dumping=true; send("DUMP"); };

$("axSeg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  [...$("axSeg").children].forEach(x=>x.classList.toggle("active",x===b));
  const ax=b.dataset.ax; $("axLbl").textContent=ax; send("AXIS:"+ax);
});

function updateRun(){ $("runState").textContent=running?"loopt":"gestopt";
  $("btnStart").disabled=!ctrlChar||running; $("btnStop").disabled=!running; }

function onData(e){
  const p=dec.decode(e.target.value).trim().split(",");
  if(p.length<3) return;
  const t=+p[0],deg=parseFloat(p[1]),N=parseFloat(p[2]),bat=p[3]!==undefined?+p[3]:null;
  $("angleVal").textContent=isNaN(deg)?"—":deg.toFixed(1);
  $("forceVal").textContent=isNaN(N)?"—":N.toFixed(0);
  if(bat!==null) $("bat").textContent=bat;
  if(running){ samples.push({iso:new Date().toISOString(),t,deg,N:isNaN(N)?"":N});
    $("nSamples").textContent=samples.length; $("lastT").textContent=t; $("btnCsv").disabled=false; redraw(); }
}
function onLog(e){ const line=dec.decode(e.target.value);
  if(line.trim()==="<<EOF>>"){ dumping=false;
    if(dumpLines.length) download("device_log.csv",dumpLines.join("\r\n")); else alert("Device-log is leeg."); return; }
  if(dumping) dumpLines.push(line); }

$("btnCsv").onclick=()=>{ let rows=["laptop_iso,ms,angle_deg,force_N"];
  samples.forEach(s=>rows.push(`${s.iso},${s.t},${s.deg},${s.N}`));
  download(`fh500_${stamp()}.csv`,rows.join("\r\n")); };
function stamp(){ return new Date().toISOString().replace(/[:.]/g,"-").slice(0,19); }
function download(name,text){ const u=URL.createObjectURL(new Blob([text],{type:"text/csv"}));
  Object.assign(document.createElement("a"),{href:u,download:name}).click(); URL.revokeObjectURL(u); }

/* ---- grafieken (geen externe libs) ---- */
const tsC=$("tsCanvas"), xyC=$("xyCanvas");
function fit(c){ const r=c.getBoundingClientRect(),d=devicePixelRatio||1;
  c.width=r.width*d; c.height=c.height*d; const x=c.getContext("2d"); x.scale(d,d); return {x,w:r.width,h:c.height/d}; }
window.addEventListener("resize",redraw);
function axis(x,w,h,pad){ x.strokeStyle="#26302f"; x.lineWidth=1; x.beginPath();
  x.moveTo(pad,8); x.lineTo(pad,h-22); x.lineTo(w-8,h-22); x.stroke(); }
function redraw(){ drawTS(); drawXY(); }
function drawTS(){ const {x,w,h}=fit(tsC); const pad=42; x.clearRect(0,0,w,h); axis(x,w,h,pad);
  if(samples.length<2) return; const ts=samples.map(s=>s.t),tmin=Math.min(...ts),tmax=Math.max(...ts);
  [["#00b4ce",s=>s.N],["#f0b429",s=>s.deg]].forEach(([col,get])=>{
    const vals=samples.map(get).filter(v=>v!==""&&!isNaN(v)); if(!vals.length) return;
    let lo=Math.min(...vals),hi=Math.max(...vals); if(hi===lo){hi+=1;lo-=1;}
    x.strokeStyle=col; x.lineWidth=1.6; x.beginPath(); let st=false;
    samples.forEach(s=>{ const v=get(s); if(v===""||isNaN(v))return;
      const px=pad+(s.t-tmin)/(tmax-tmin||1)*(w-pad-8), py=8+(1-(v-lo)/(hi-lo))*(h-30);
      st?x.lineTo(px,py):x.moveTo(px,py); st=true; }); x.stroke(); });
  x.fillStyle="#8aa39f"; x.font="11px ui-monospace,monospace"; x.fillText("t (ms)",w-46,h-6); }
function drawXY(){ const {x,w,h}=fit(xyC); const pad=46; x.clearRect(0,0,w,h); axis(x,w,h,pad);
  const pts=samples.filter(s=>s.N!==""&&!isNaN(s.N)&&!isNaN(s.deg)); if(!pts.length) return;
  const ds=pts.map(p=>p.deg),ns=pts.map(p=>p.N);
  let dlo=Math.min(...ds),dhi=Math.max(...ds); if(dhi===dlo){dhi+=1;dlo-=1;}
  let nlo=Math.min(0,...ns),nhi=Math.max(...ns); if(nhi===nlo)nhi+=1;
  const X=d=>pad+(d-dlo)/(dhi-dlo)*(w-pad-12), Y=n=>8+(1-(n-nlo)/(nhi-nlo))*(h-30);
  x.strokeStyle="#00b4ce"; x.lineWidth=1.4; x.globalAlpha=.55; x.beginPath();
  pts.forEach((p,i)=>i?x.lineTo(X(p.deg),Y(p.N)):x.moveTo(X(p.deg),Y(p.N))); x.stroke(); x.globalAlpha=1;
  x.fillStyle="#00b4ce"; pts.forEach(p=>{x.beginPath();x.arc(X(p.deg),Y(p.N),2.2,0,7);x.fill();});
  x.fillStyle="#8aa39f"; x.font="11px ui-monospace,monospace";
  x.fillText("hoek (°)",w-60,h-6); x.fillText(nhi.toFixed(0)+" N",6,14);
  x.fillText(dlo.toFixed(0)+"°",pad-4,h-8); x.fillText(dhi.toFixed(0)+"°",w-30,h-8); }
redraw();
</script>
</body>
</html>
